baseURL: https://cnpg-extensions.github.io/cnpg-extensions-website/
locale: en-US
title: CNPG Extensions
theme: hextra
enableRobotsTXT: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
outputs:
  home: [HTML]
disableKinds: [taxonomy, term, RSS]

# The site supplies its own accessible Copy buttons in assets/js/site.js.
params:
  highlight:
    copy:
      enable: false
