name: Refresh versions history
on:
  workflow_dispatch:
    inputs:
      rebuild_history:
        description: Refetch all version-history metadata and image links
        type: boolean
        default: false
  schedule:
    - cron: '30 9 * * *'
permissions:
  contents: read
concurrency:
  group: versions-history-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cnpg-extensions/artifacts
          ref: main
          path: .cache/artifacts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare history catalog
        run: python scripts/version_history_snapshot.py prepare .cache/artifacts/image-catalogs-extensions .cache/history-catalog.json
      - name: Restore private history progress
        if: ${{ !inputs.rebuild_history }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/version-history/history.json
          key: history-progress-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: history-progress-v1-${{ runner.os }}-
      - name: Refresh all extension histories
        id: history
        run: python scripts/preview-versions.py --all --catalog .cache/history-catalog.json --history-file .cache/version-history/history.json
      - name: Save private history progress
        if: ${{ always() && (steps.history.outcome == 'success' || steps.history.outcome == 'failure') && hashFiles('.cache/version-history/history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/version-history/history.json
          key: history-progress-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate and publish complete snapshot
        run: python scripts/version_history_snapshot.py publish .cache/version-history/history.json .cache/history-catalog.json .cache/history-release/version-history.json
      - name: Upload complete history snapshot
        uses: actions/upload-artifact@v4
        with:
          name: versions-history-snapshot
          path: .cache/history-release/version-history.json
          if-no-files-found: error
          retention-days: 90
      - name: Report history refresh failure
        if: ${{ failure() }}
        run: |
          echo "::error::Versions history refresh failed, possibly after partial progress. No snapshot from this run is eligible for the website."
          echo "History refresh failed. Saved private progress can be reused on the next attempt. The website will still build using the latest successful snapshot, or current catalog if none exists." >> "$GITHUB_STEP_SUMMARY"
