name: Verify hosted cache persistence
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  populate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/verify-caches.py populate
      - uses: actions/cache/save@v4
        with:
          path: |
            .cache/version-history/history.json
            .cache/image-notices-v1
            .cache/cache-verification.json
          key: cache-proof-${{ github.run_id }}-${{ github.run_attempt }}
  restore:
    needs: populate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/version-history/history.json
            .cache/image-notices-v1
            .cache/cache-verification.json
          key: cache-proof-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - run: python scripts/verify-caches.py restore
