name: Build and publish website
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:
    inputs:
      rebuild_history:
        description: Refetch all version-history metadata and image links
        type: boolean
        default: false
      rebuild_notices:
        description: Re-extract license notices from every current image
        type: boolean
        default: false
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/install-tools.py
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .cache/oci
          key: oci-${{ runner.os }}-${{ github.run_id }}
          restore-keys: oci-${{ runner.os }}-
      - name: Restore immutable image notices
        if: ${{ !inputs.rebuild_notices }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/image-notices-v1
          key: notices-${{ runner.os }}-${{ hashFiles('scripts/image_notices.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notices-${{ runner.os }}-${{ hashFiles('scripts/image_notices.py') }}-
      - name: Restore versions history
        if: ${{ !inputs.rebuild_history }}
        uses: actions/cache/restore@v4
        with:
          path: data/version_history.json
          key: versions-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: versions-v1-${{ runner.os }}-
      - name: Test metadata processing
        run: python -m unittest discover -s tests -v
      - name: Refresh catalog, READMEs, SBOMs, container notices, and advisory matches
        run: python scripts/generate.py --refresh --scan --workers 4
      - name: Save immutable image notices
        uses: actions/cache/save@v4
        with:
          path: .cache/image-notices-v1
          key: notices-${{ runner.os }}-${{ hashFiles('scripts/image_notices.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh versions history incrementally
        id: versions
        run: python scripts/preview-versions.py --all
      - name: Save versions history
        if: ${{ always() && steps.versions.outcome != 'skipped' && hashFiles('data/version_history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/version_history.json
          key: versions-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build Hugo
        run: hugo --minify --baseURL 'https://cnpg-extensions.github.io/'
      - name: Validate generated output
        run: python scripts/check-site.py public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.repository == 'cnpg-extensions/cnpg-extensions.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
